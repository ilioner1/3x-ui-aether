name: Reseller bot CI
on:
  pull_request:
    paths:
      - 'reseller-bot/**'
      - 'internal/web/controller/delegated*.go'
      - '.github/workflows/reseller-bot.yml'
  push:
    branches: [reseller-bot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reseller-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bot.py reseller_sales.py
      - run: python -m unittest -v
      - run: python -c 'import bot'
        env:
          BOT_TOKEN: '123456789:ci-test-value-only'
          SUPER_ADMIN_ID: '1'
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - run: go test ./internal/web/controller -run '^TestDelegated' -count=1 -v
  panel-update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
          mkdir -p build
          go build -trimpath -o build/x-ui .
      - name: Package the native panel update
        env:
          ARCH: ${{ matrix.arch }}
          MTG_MULTI_VER: v1.16.1
        run: |
          bash DockerInit.sh "$ARCH"
          bash scripts/install-aether.sh build/bin
          cp LICENSE x-ui.sh x-ui.service.debian build/
          mkdir -p packages package-root
          mv build package-root/x-ui
          archive="x-ui-linux-$ARCH.tar.gz"
          tar -C package-root -czf "packages/$archive" x-ui
          (cd packages && sha256sum "$archive" > "$archive.sha256")
          cp scripts/update-aether-panel.sh packages/
      - uses: actions/upload-artifact@v4
        with:
          name: x-ui-sales-update-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error
