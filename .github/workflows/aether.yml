name: Aether integration
on:
  push:
    branches: [feat/aether-outbound]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Aether regression tests
        run: go test ./internal/aether -count=1
