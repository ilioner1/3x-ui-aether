name: Aether native Linux release
on:
  push:
    branches: [feat/aether-outbound]
    paths:
      - .github/workflows/aether-native.yml
      - install.sh
      - x-ui.sh
      - x-ui.service.debian
      - scripts/install-aether.sh
      - internal/web/controller/server.go
permissions:
  contents: read
concurrency:
  group: aether-native-release
  cancel-in-progress: true
env:
  RELEASE_TAG: v3.11.0-aether.1
jobs:
  package:
    if: github.repository == 'ilioner1/3x-ui-aether'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the panel
        run: |
          bash -n install.sh
          bash -n x-ui.sh
          npm --prefix frontend ci
          npm --prefix frontend run build
          mkdir -p build
          go build -trimpath -o build/x-ui .
      - name: Package the panel, Xray and Aether
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash DockerInit.sh "$ARCH"
          bash scripts/install-aether.sh build/bin
          cp LICENSE x-ui.sh x-ui.service.debian build/
          mkdir -p packages package-root
          mv build package-root/x-ui
          archive="x-ui-linux-$ARCH.tar.gz"
          tar -C package-root -czf "packages/$archive" x-ui
          (cd packages && sha256sum "$archive" > "$archive.sha256")
      - name: Install and verify the systemd service and x-ui menu
        run: |
          if ! sudo env XUI_AETHER_PACKAGE_DIR="$PWD/packages" XUI_NONINTERACTIVE=1 XUI_PANEL_PORT=20953 XUI_SSL_MODE=none XUI_ENABLE_FAIL2BAN=false bash install.sh >"$RUNNER_TEMP/aether-install.log" 2>&1; then
            echo "Native installer failed. Installer output is private because it may contain credentials."
            exit 1
          fi
          sudo systemctl is-enabled --quiet x-ui
          sudo systemctl is-active --quiet x-ui
          test -x /usr/bin/x-ui
          test -x /usr/local/x-ui/bin/aether
          sudo /usr/bin/x-ui status
          sudo systemctl show x-ui -p Environment --value | grep -Fq XUI_AETHER_NATIVE=1
          sudo bash -c '
            source /etc/x-ui/install-result.env
            test "$XUI_PANEL_PORT" = 20953
            for i in {1..15}; do
              if curl --noproxy "*" --silent --fail --max-time 2 -o /tmp/aether-panel-login "http://127.0.0.1:${XUI_PANEL_PORT}/${XUI_WEB_BASE_PATH#/}"; then
                grep -qi "<html" /tmp/aether-panel-login
                exit $?
              fi
              sleep 1
            done
            exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: packages/
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages
      - name: Publish the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This release already exists. Use a new release tag for updates."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "3x-ui Aether native Linux" --notes "Native Ubuntu/Debian systemd packages with Aether. See AETHER.fa.md in the release source." \
            packages/*.tar.gz packages/*.sha256
