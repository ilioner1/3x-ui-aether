name: Aether client connection
on:
  push:
    branches: [feat/aether-outbound]
    paths:
      - .github/workflows/aether-client.yml
      - scripts/smoke-aether-client.py
permissions:
  contents: read
jobs:
  vless:
    if: github.repository == 'ilioner1/3x-ui-aether'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the published x-ui release
        run: |
          installer="$RUNNER_TEMP/install.sh"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ilioner1/3x-ui-aether/v3.11.0-aether.1/install.sh -o "$installer"
          if ! sudo env XUI_NONINTERACTIVE=1 XUI_PANEL_PORT=20953 XUI_SSL_MODE=none XUI_ENABLE_FAIL2BAN=false bash "$installer" >"$RUNNER_TEMP/aether-install.log" 2>&1; then
            echo "The native installer failed"
            exit 1
          fi
          sudo systemctl is-active --quiet x-ui
      - name: Connect with the VLESS link exported by the panel
        run: |
          sudo bash -ec '
            source /etc/x-ui/install-result.env
            export XUI_PANEL_PORT XUI_WEB_BASE_PATH XUI_API_TOKEN
            exec python3 scripts/smoke-aether-client.py
          '
