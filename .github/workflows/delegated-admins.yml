name: Delegated admins
on:
  push:
    branches: [feat/aether-outbound]
    paths:
      - 'internal/delegation/**'
      - 'internal/web/controller/delegated*'
      - '.github/workflows/delegated-admins.yml'
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: delegated-test
          POSTGRES_DB: xui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist-stub
      - run: go test ./internal/web/controller -run '^TestDelegated(AccountIsolationAndQuota|LedgerAndReportsWithManyClients)$' -v -count=1 -timeout=5m
        env:
          XUI_DB_TYPE: ${{ matrix.database }}
          XUI_DB_DSN: postgres://postgres:delegated-test@127.0.0.1:5432/xui?sslmode=disable
  format-delegate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - working-directory: frontend
        run: npx --no-install oxfmt src/routes/panelRoutes.tsx src/layouts/AppSidebar.tsx src/hooks/useClients.ts src/schemas/client.ts src/pages/clients/ClientsPage.tsx src/pages/admins/AdminsPage.tsx
      - run: |
          curl -fsSL https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/golangci-lint-2.15.0-linux-amd64/golangci-lint" fmt internal/web/controller/delegated.go internal/web/controller/spa.go internal/web/service/client_paging.go internal/sub/service.go internal/web/controller/delegated_panel.go internal/web/controller/delegated_master.go internal/sub/service_info_node_test.go
      - if: always()
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          for path in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              print('DELEGATE_FORMAT=' + json.dumps([path, base64.b64encode(pathlib.Path(path).read_bytes()).decode()]), flush=True)
          PY
